name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # apps/web runs `next typegen` first: the App Router's LayoutProps /
      # PageProps globals do not exist in a clean checkout until they are
      # generated, and typegen does that without a full build.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
